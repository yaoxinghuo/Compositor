name: Build macOS 15

on:
  push:
    branches: [main, macos-15-universal]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-macos15-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: universal build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Release has no Developer ID here: Manual + "-" ad-hoc signs the app and its embedded
      # Sparkle framework, so the bundle is internally consistent and Gatekeeper's quarantine
      # can be cleared with xattr on the user's machine.
      - name: Build Release (universal, ad-hoc signed)
        run: >
          xcodebuild build
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'generic/platform=macOS'
          -configuration Release
          -derivedDataPath DerivedData
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=-
          DEVELOPMENT_TEAM=

      - name: Verify universal binary and minimum system version
        run: |
          APP=DerivedData/Build/Products/Release/Compositor.app
          lipo -info "$APP/Contents/MacOS/Compositor"
          MINIMUM=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist")
          echo "LSMinimumSystemVersion: $MINIMUM"
          test "$MINIMUM" = "15.4"

      - name: Package DMG
        run: |
          mkdir -p dist
          hdiutil create -volname Compositor \
            -srcfolder DerivedData/Build/Products/Release/Compositor.app \
            -ov -format UDZO dist/Compositor-macOS15.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Compositor-macOS15-universal
          path: dist/Compositor-macOS15.dmg
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/Compositor-macOS15.dmg
          --title "Compositor $GITHUB_REF_NAME (macOS 15 universal)"
          --notes "Universal build for macOS 15 or later — Intel and Apple Silicon.
          Ad-hoc signed rather than notarized: on first open, right-click the app and choose Open,
          or run \`xattr -dr com.apple.quarantine /Applications/Compositor.app\`."
